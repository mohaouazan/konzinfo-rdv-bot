name: watch

on:
  schedule:
    # Roue de secours seulement : le cron GitHub est tres irregulier (2 runs en 10 h observes).
    # La cadence reelle (toutes les 3 min) vient de cron-job.org, qui declenche workflow_dispatch via l'API (voir README).
    - cron: "7-59/15 * * * *"
  workflow_dispatch:

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependances
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restaurer l'etat precedent
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Verification des creneaux
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check.py

      - name: Sauvegarder l'etat
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}
